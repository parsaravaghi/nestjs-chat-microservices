services:
  users_db:
    image: mysql:9
    env_file:
      - ./apps/users/.env
    volumes:
      - user_data:/var/lib/mysql
    ports:
      - 3306:3306
      
  rabbitmq:
    image: rabbitmq:4-management-alpine
    env_file:
      - .env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - 5672:5672
      - 15672:15672

  chat_db:
    build:
      context: .
      dockerfile: ./apps/chat/dockerfile

    image: chat-mongo:8

    restart: always

    env_file:
      - ./apps/chat/.env

    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /etc/mongodb-keyfile

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    ports:
      - "27017:27017"

  mongo-init:
    image: mongo:8

    depends_on:
      chat_db:
        condition: service_healthy

    env_file:
      - ./apps/chat/.env

    command: >
      /bin/sh -c '
      mongosh
      --host chat_db:27017
      --username "$$MONGO_INITDB_ROOT_USERNAME"
      --password "$$MONGO_INITDB_ROOT_PASSWORD"
      --authenticationDatabase admin
      --eval "
        try {
          rs.status();
          print(\"Replica set already initialized\");
        } catch (e) {
          rs.initiate({
            _id: \"rs0\",
            members: [
              {
                _id: 0,
                host: \"'$$APP_DB_HOST':27017\"
              }
            ]
          });
        }
      "
      '

volumes:
  user_data:
  rabbitmq_data:
  chat_db_data:
  chat_db_config: